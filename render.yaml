# Render Blueprint: v Renderju izberi New > Blueprint in poveži ta repozitorij.
# Navodila: docs/objava.md
services:
  - type: web
    name: kompreno
    runtime: node
    region: frankfurt          # najbližje Sloveniji
    plan: starter              # trajni disk ni na voljo v brezplačnem paketu
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false          # nova različica vsaki 2 uri: .github/workflows/render-posodobitev.yml
    disk:
      name: stemmind-data
      mountPath: /var/data     # baza učencev ostane ob vsaki posodobitvi
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: STEMMIND_DB
        value: /var/data/stemmind.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STEMMIND_PASSWORD
        sync: false
      - key: STEMMIND_ACCOUNTS
        value: "1"
      - key: STEMMIND_BASE_URL
        sync: false
      - key: STEMMIND_ADMIN_EMAILS
        sync: false
      - key: STEMMIND_DAILY_QUESTIONS
        value: "0"
      - key: STEMMIND_FREE_DAILY_QUESTIONS
        value: "10"
      - key: STEMMIND_STUDENT_MONTHLY_USD
        value: "1.5"
      - key: STEMMIND_MONTHLY_BUDGET_USD
        value: "50"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
