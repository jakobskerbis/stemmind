# Render: nova različica Evklid vsaki 2 uri (ne ob vsaki spremembi, da se strežnik
# s trajnim diskom ne zaganja ves dan). Deluje, ko je v GitHubu nastavljena skrivnost
# RENDER_DEPLOY_HOOK (Render > evklid > Settings > Deploy Hook). Navodila: docs/posodobitve.md
name: Render vsaki 2 uri
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objavi:
    runs-on: ubuntu-latest
    steps:
      - name: Objavi, če je v main kaj novega
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK ni nastavljen, preskočeno."; exit 0; fi
          # 2 uri in 15 minut: GitHub zamakne zagon po urniku, raje enkrat preveč kot premalo.
          since=$(date -u -d '135 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/commits?sha=main&since=$since&per_page=1" | jq length)
          if [ "$n" = "0" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "Ni novih sprememb."; exit 0; fi
          curl -fsS -X POST "$HOOK" >/dev/null && echo "Objava sprožena."
